name: report-reminder
on:
  # 1st of every month, 14:00 UTC (10:00 New York in summer, 09:00 in winter).
  # The report in reports/latest is a snapshot at one block number and is
  # regenerated by hand on this machine (the SQLite DB is local, not in git);
  # this workflow only opens the reminder issue. Note GitHub disables cron
  # workflows in a public repo after 60 days without a commit -- the monthly
  # report commit keeps this one (and live.yml) alive.
  schedule: [{ cron: "0 14 1 * *" }]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: gh only needs the token. Assigning the issue is what
      # triggers the e-mail notification to the assignee.
      - name: open the monthly refresh issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          month="$(date -u +%Y-%m)"
          title="Refresh Base report ($month)"
          gh label create report-refresh --repo "$REPO" --force \
            --color 0E8A16 --description "Monthly regeneration of reports/latest"
          if [ "$(gh issue list --repo "$REPO" --label report-refresh --state open --json number --jq length)" != "0" ]; then
            echo "an open report-refresh issue already exists; not opening another"
            exit 0
          fi
          body="$(cat <<'MD'
          Monthly reminder: regenerate `reports/latest` from the live Base chain.

          All commands run in `projects/robustrep/` on the machine that holds `data/base.db`.

          ```sh
          source .venv/bin/activate
          # 1. incremental pull of new feedback + block timestamps (resumable; a month of
          #    Base is ~1.3M blocks and takes ~3.5 h at the default 0.5 s RPC interval)
          nohup robustrep --verbose fetch --db data/base.db --skip-owners --skip-raters --skip-evidence >> logs/fetch-1.log 2>&1 &
          #    done when the log shows "feedback rows added:" and "block timestamps filled:";
          #    then `sqlite3 data/base.db "select count(*) from failed_ranges"` must be 0
          # 2. rater profiles for new addresses only. Blockscout's Base API is gone (2026-10),
          #    so this needs the Alchemy key from the macOS keychain; --profile-source alchemy
          #    makes a missing key fail at the first address instead of falling back. The same
          #    run does the second pass (funder = smart-account owner key over plain RPC).
          ALCHEMY_API_KEY=$(security find-generic-password -a "$USER" -s alchemy-api-key -w) \
            nohup robustrep --verbose fetch --db data/base.db --skip-owners --skip-evidence --profile-source alchemy >> logs/fetch-2.log 2>&1 &
          #    done when the log shows "raters profiled:"; the key never appears in the log
          # 3. evidence for new URIs (optional, hours if many)
          nohup robustrep --verbose fetch --db data/base.db --skip-owners --skip-raters >> logs/fetch-3.log 2>&1 &
          # 4. report (~40 min). Provenance now lists rpc_sources, rater_profile_mode and
          #    funder_kind_counts; owner-key clustering merges each operator's wallets, so the
          #    cluster numbers move a lot versus the September report -- say so in the write-up.
          .venv/bin/robustrep report --db data/base.db --out-dir reports --bootstrap-n 1000
          # 5. publish
          git add reports/latest && git commit -m "docs: refresh Base report" && git push
          ```

          Check afterwards: https://iamdongwang.github.io/robustrep/reports/latest/scores.json shows the new block number.

          Close this issue when done. The commit also keeps the scheduled workflows (this one and `live.yml`) from being disabled by GitHub's 60-day inactivity rule.
          MD
          )"
          gh issue create --repo "$REPO" --title "$title" --label report-refresh \
            --assignee "$OWNER" --body "$body"
