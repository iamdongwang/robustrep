name: live-e2e
on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: python -m pip install -c constraints.txt --upgrade pip
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: pytest -m live tests/e2e/test_live.py -v
