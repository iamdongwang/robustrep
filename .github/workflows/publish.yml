name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # A tag does not re-run ci.yml (it is scoped to branches), and a release is
  # the one build nobody gets to re-do, so the full gate runs here before the
  # artifacts that get uploaded are produced.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      # The tag names the release; pyproject names what gets built. A mismatch
      # publishes a version nobody tagged (or tags one nobody can reproduce),
      # and a release is the one build that cannot be re-done -- so fail here,
      # before anything is built or uploaded. Runs after setup-python because
      # it needs tomllib (3.11+).
      - name: tag matches pyproject version
        run: |
          test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      # The release notes are checked here, before the upload PyPI cannot undo:
      # the CHANGELOG must have a non-empty section for this tag, and that
      # section must be fit for the public Releases page and its notification
      # feed (no bare @mentions, none of the §5.5b vocabulary). The `release`
      # job re-runs the same script only to write the file it attaches.
      - name: changelog has publishable notes for this tag
        run: python scripts/changelog_section.py CHANGELOG.md "${GITHUB_REF_NAME#v}" --lint > /dev/null
      - run: python -m pip install -c constraints.txt --upgrade pip
      - run: pip install -e ".[dev]" -c constraints.txt
      # pip-audit fetches the advisory database over the network; retry a
      # transient fetch failure (connection reset) a few times before failing.
      - run: |
          for attempt in 1 2 3; do
            pip-audit --strict --progress-spinner off --no-deps -r constraints.txt && exit 0
            echo "pip-audit attempt $attempt failed; retrying in 15s"; sleep 15
          done
          exit 1
      - run: pytest -q
      # `pip install -c` does not reach into PEP 517 build environments: the
      # isolated env `python -m build` creates resolves its own setuptools and
      # wheel from PyPI, unconstrained and outside the audit above. Constraining
      # `build` itself is as far as the pin reaches; closing the rest would mean
      # `--no-isolation` with a pinned backend, which is a separate change.
      - run: pip install -c constraints.txt build
      - run: python -m build
      # The metadata PyPI will render, checked before upload rather than after
      # a rejected (or silently mangled) release page. twine comes from the dev
      # extra installed above, pinned by constraints.txt.
      - run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
  # The GitHub Release is the human-facing record of what PyPI now serves:
  # notes are the tag's CHANGELOG section (validated in `build` above, before
  # the upload), and the wheel and sdist attached are proven byte-identical to
  # what PyPI serves before the page is created. It runs only after the upload
  # succeeded, so a rejected upload leaves no release page claiming otherwise.
  # This is the one job holding `contents: write`, so it is kept small: no
  # setup-python (the runner's python3 runs the two stdlib-only scripts), no
  # pip install, the checkout does not persist the token into .git/config, and
  # the token reaches exactly one step, the `gh` call.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with: { name: dist, path: dist/ }
      - name: attached files match what PyPI serves
        run: python3 scripts/pypi_digests_match.py robustrep "${GITHUB_REF_NAME#v}" dist/
      - name: release notes from CHANGELOG
        run: python3 scripts/changelog_section.py CHANGELOG.md "${GITHUB_REF_NAME#v}" --lint > notes.md
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "robustrep ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
