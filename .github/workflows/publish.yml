name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # A tag does not re-run ci.yml (it is scoped to branches), and a release is
  # the one build nobody gets to re-do, so the full gate runs here before the
  # artifacts that get uploaded are produced.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install -c constraints.txt --upgrade pip
      - run: pip install -e ".[dev]" -c constraints.txt
      # pip-audit fetches the advisory database over the network; retry a
      # transient fetch failure (connection reset) a few times before failing.
      - run: |
          for attempt in 1 2 3; do
            pip-audit --strict --progress-spinner off --no-deps -r constraints.txt && exit 0
            echo "pip-audit attempt $attempt failed; retrying in 15s"; sleep 15
          done
          exit 1
      - run: pytest -q
      # `pip install -c` does not reach into PEP 517 build environments: the
      # isolated env `python -m build` creates resolves its own setuptools and
      # wheel from PyPI, unconstrained and outside the audit above. Constraining
      # `build` itself is as far as the pin reaches; closing the rest would mean
      # `--no-isolation` with a pinned backend, which is a separate change.
      - run: pip install -c constraints.txt build
      - run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
